services:
  - type: web
    name: resumetrics-ai
    runtime: node
    region: oregon
    plan: standard
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: GEMINI_API_KEY
        scope: build
        sync: false
      - key: VITE_SUPABASE_URL
        value: ""
      - key: VITE_SUPABASE_ANON_KEY
        scope: build
        sync: false
    healthCheckPath: /api/health
    preDeployCommand: npm run lint
    disk:
      name: resumetrics-data
      mountPath: /data
      sizeGB: 1
